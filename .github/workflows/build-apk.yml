name: Build APK

on:
  push:
    branches: [main]
    paths: ['bundle.b64']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VERSION: 3.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Extraire le projet
        run: |
          tr -d ' \n\r' < bundle.b64 | base64 -d > bundle.txz
          tar xJf bundle.txz
          mv be-better app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Version et icônes
        working-directory: app
        run: |
          python3 - <<'PY'
          import json, os
          a = json.load(open('app.json'))
          v = os.environ['APP_VERSION']
          a['expo']['version'] = v
          a['expo']['android']['versionCode'] = 30000 + int(v.split('.')[-1])
          json.dump(a, open('app.json', 'w'), ensure_ascii=False, indent=2)
          print('version', v)
          PY
          pip install --quiet pillow
          python3 scripts/gen_icons.py

      - name: Installer les dépendances
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Générer le projet Android
        working-directory: app
        run: npx expo prebuild -p android --no-install

      - name: Signature permanente
        working-directory: app
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            python3 scripts/sign_release.py
          else
            echo "::warning::Secret KEYSTORE_B64 absent : APK signé avec la clé de test"
          fi

      - name: Compiler l'APK
        working-directory: app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp app/android/app/build/outputs/apk/release/app-release.apk BE-BETTER.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BE-BETTER-apk
          path: BE-BETTER.apk

      - name: Publier la version (lien de téléchargement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: BE BETTER ${{ env.APP_VERSION }}
          body: APK Android de BE BETTER. Télécharge BE-BETTER.apk depuis ton téléphone puis installe-le.
          files: BE-BETTER.apk
          make_latest: true
