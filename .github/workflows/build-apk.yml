name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Extraire le projet
        run: |
          tr -d ' \n\r' < bundle.b64 | base64 -d > bundle.txz
          tar xJf bundle.txz
          mv be-better app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Générer les icônes
        working-directory: app
        run: |
          pip install --quiet pillow
          python3 scripts/gen_icons.py

      - name: Installer les dépendances
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Générer le projet Android
        working-directory: app
        run: npx expo prebuild -p android --no-install

      - name: Compiler l'APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp app/android/app/build/outputs/apk/release/app-release.apk BE-BETTER.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BE-BETTER-apk
          path: BE-BETTER.apk

      - name: Publier la version (lien de téléchargement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BE BETTER 1.0.${{ github.run_number }}
          body: APK Android de BE BETTER. Télécharge BE-BETTER.apk depuis ton téléphone puis installe-le.
          files: BE-BETTER.apk
          make_latest: true
